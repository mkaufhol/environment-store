[project]
name = "environment-store"
version = "2.0.0"
description = "Keep environment variables in named, optionally encrypted stores and load them anywhere."
authors = [
    {name = "Maalik Kaufhold", email = "mail@maalikaufhold.de"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The core depends on cryptography only, so encryption always works; >= 44 for Argon2id.
dependencies = [
    "cryptography>=44",
]
keywords = [
    "environment",
    "environment-variables",
    "dotenv",
    "configuration",
    "secrets",
    "encryption",
    "sqlite",
    "postgresql",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mkaufhol/environment-store"
Repository = "https://github.com/mkaufhol/environment-store"
Issues = "https://github.com/mkaufhol/environment-store/issues"
Changelog = "https://github.com/mkaufhol/environment-store/blob/main/CHANGELOG.md"

[project.scripts]
# Both names run the same CLI.
environment-store = "environment_store.cli:main"
envs = "environment_store.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# >= 0.26: click is vendored; the CLI relies on its exception hierarchy.
cli = ["typer>=0.26"]
# >= 8.2: the tested version line.
tui = ["textual>=8.2"]
all = [
    "psycopg[binary]>=3.2",
    "typer>=0.26",
    "textual>=8.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
    "ty>=0.0.98",
]
testing = [
    "coverage>=7.17.2",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    # Optional imports, so that ty and the tests see every extra.
    "psycopg[binary]>=3.2",
    "typer>=0.26",
    "textual>=8.2",
    # Only for the dotenv compatibility tests of the dotenv writer.
    "python-dotenv>=1.2.4",
]

[tool.uv]
default-groups = ["dev", "testing"]
# Rebuild path installs (uvx --from <path>, uv add <path>) when sources change, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The contents of docs/man land at the install prefix, so the wheel installs the man page as
# <prefix>/share/man/man1/envs.1 and `man envs` works.
data = { data = "docs/man" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL", "RUF", "ANN", "S", "PT",
    "TID", "TC", "ERA", "PERF", "FBT", "EM", "TRY", "D",
    # Beyond the usual set: aware datetimes only, no print in the library, no blind except
    # (CONTRIBUTING.md sections 4 and 5).
    "DTZ", "T20", "BLE",
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts, need no docstrings and compare against literal expected values.
"tests/**" = ["S101", "D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "postgres: needs a PostgreSQL server (ENV_STORE_TEST_POSTGRES_URL or initdb/pg_ctl on PATH)",
]

[tool.coverage.run]
branch = true
source = ["environment_store"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.$',
    "raise NotImplementedError",
    'if sys\.platform == "win32":',
]

[tool.bandit]
exclude_dirs = ["tests"]
