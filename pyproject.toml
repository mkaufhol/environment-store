[project]
name = "environment-store"
version = "0.1.0"
description = "Python library to store and manage environment variables persistently."
authors = [
    {name = "Maalik Kaufhold",email = "mail@maalikaufhold.de"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic>=2.12.5",
]
keywords = [
    "aws",
    "environment",
    "variables",
    "environment-variables",
    "parameter-store",
    "secrets-manager",
    "ssm",
    "boto3",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
environment-store = "environment_store.cli:main"

[project.urls]
Homepage = "https://github.com/mkaufhol/environment-store"
Repository = "https://github.com/mkaufhol/environment-store"
Issues = "https://github.com/mkaufhol/environment-store/issues"

[project.optional-dependencies]
aws = ["boto3>=1.42.68"]
postgres = ["psycopg>=3.3.3", "sqlalchemy>=2.0.48"]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "ty>=0.0.1",
    "pre-commit>=4.3.0",
    "bandit>=1.9.4",
    "tox>=4.49.1",
    "tox-uv>=1.0.0",
    "yoyo-migrations>=9.0.0",
]
stubs = [
    "boto3-stubs>=1.42.68",
]
testing = [
    "pytest>=9.0.2",
    "moto>=5.1.22",
    "coverage>=7.13.4",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.3.3",
]

[tool.uv]
default-groups = ["dev", "testing", "stubs"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 96
extend-exclude = [
    "src/environment_store/adapters/postgresql/queries.py",
    "src/environment_store/adapters/postgresql/models.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 30
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    "src/environment_store/adapters/postgresql/queries.py",
    "src/environment_store/adapters/postgresql/models.py",
]
